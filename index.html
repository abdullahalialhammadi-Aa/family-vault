<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نظام التحقق بواسطة الذكاء الاصطناعي</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    input, button { margin: 10px 0; padding: 10px; width: 90%; font-size: 16px; }
    button { background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    #verification-section { display: none; }
    img { max-width: 200px; margin-top: 10px; border-radius: 5px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
</head>
<body>

  <div class="card">
    <!-- واجهة تسجيل الدخول -->
    <div id="login-section">
      <h2>تسجيل الدخول</h2>
      <input type="text" id="username" placeholder="اسم المستخدم">
      <input type="password" id="password" placeholder="كلمة المرور">
      <button onclick="handleLogin()">دخول</button>
    </div>

    <!-- واجهة التحقق بالصورة -->
    <div id="verification-section">
      <h2>التحقق بالصورة</h2>
      <p>يرجى رفع صورة <b>COFFEE</b> أو <b>MOUSE</b> للتحقق:</p>
      <input type="file" id="imageInput" accept="image/*" onchange="previewAndVerify(event)">
      <br>
      <img id="preview" src="#" alt="المعاينة" style="display:none;">
      <h3 id="result"></h3>
    </div>
  </div>

  <script>
    // المسار الحالي المباشر للملفات في GitHub
    const MODEL_URL = "./"; 
    let model;

    async function initModel() {
      model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
    }
    initModel();

    function handleLogin() {
      const user = document.getElementById("username").value;
      if (user !== "") {
        document.getElementById("login-section").style.display = "none";
        document.getElementById("verification-section").style.display = "block";
      } else {
        alert("يرجى إدخال اسم المستخدم");
      }
    }

    async function previewAndVerify(event) {
      const file = event.target.files[0];
      if (!file) return;

      const imgElement = document.getElementById("preview");
      imgElement.src = URL.createObjectURL(file);
      imgElement.style.display = "inline-block";

      document.getElementById("result").innerText = "جاري التحقق...";

      imgElement.onload = async () => {
        const predictions = await model.predict(imgElement);
        let bestMatch = predictions.reduce((max, p) => p.probability > max.probability ? p : max, predictions[0]);
        let confidence = (bestMatch.probability * 100).toFixed(1);

        if (bestMatch.className.toUpperCase() === "COFFEE" || bestMatch.className.toUpperCase() === "MOUSE") {
          document.getElementById("result").innerText = `تم التعرف: ${bestMatch.className} (${confidence}%)`;
        } else {
          document.getElementById("result").innerText = "الصورة غير مطابقة!";
        }
      };
    }
  </script>
</body>
</html>
