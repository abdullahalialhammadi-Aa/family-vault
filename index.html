<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الذاكرة الرقمية للأجيال - التحقق الحَي</title>
  <style>
    :root {
      --primary-color: #8C2B2B;
      --accent-color: #C5A059;
      --bg-color: #FAF6F0;
      --card-bg: #FFFFFF;
      --text-color: #333333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      direction: rtl;
    }

    .vault-card {
      background: var(--card-bg);
      border: 1px solid #E5DDCB;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(140, 43, 43, 0.08);
      text-align: center;
    }

    .logo-title {
      font-size: 22px;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 13px;
      color: #777;
      margin-bottom: 20px;
    }

    .input-field {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      border: 1px solid #D1C7BD;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .btn-main {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: #FFF;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-main:hover {
      background-color: #6E2020;
    }

    /* حاوية الفيديو والكاميرا المباشرة */
    .webcam-container {
      position: relative;
      width: 100%;
      height: 260px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin: 15px 0;
      border: 2px solid var(--accent-color);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scan-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      border: 2px dashed rgba(255, 255, 255, 0.7);
      border-radius: 10px;
      pointer-events: none;
    }

    #status-msg {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>

  <!-- TensorFlow & Teachable Machine CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
</head>
<body>

  <div class="vault-card">
    <div class="logo-title">الذاكرة الرقمية للأجيال</div>
    <div class="subtitle">Family Vault - نظام التحقق الحي</div>

    <!-- 1. خطوة تسجيل الدخول -->
    <div id="login-step">
      <input type="text" id="username" class="input-field" placeholder="اسم المستخدم">
      <input type="password" id="password" class="input-field" placeholder="كلمة المرور">
      <button class="btn-main" onclick="proceedToLiveScan()">تسجيل الدخول</button>
    </div>

    <!-- 2. خطوة البصمة الحية (الكاميرا) -->
    <div id="scan-step" style="display: none;">
      <p style="font-size: 14px; color: #555; margin-bottom: 10px;">
        وجه الكاميرا نحو <b>Coffee</b> أو <b>Mouse</b> واضغط لالتقاط البصمة البصرية:
      </p>
      
      <div class="webcam-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="scan-overlay"></div>
      </div>

      <button class="btn-main" onclick="captureAndVerify()">التقاط وتحليل الصورة 📷</button>
    </div>

    <div id="status-msg"></div>
  </div>

  <script>
    const MODEL_URL = "./"; 
    let model, videoStream;

    // تحميل النموذج عند البدء
    async function loadModel() {
      try {
        model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
      } catch (e) {
        console.log("جاري استدعاء النموذج...");
      }
    }
    loadModel();

    // الانتقال لخطوة فتح الكاميرا المباشرة بعد تسجيل الدخول
    async function proceedToLiveScan() {
      const user = document.getElementById('username').value;
      if (!user) return setStatus('يرجى إدخال اسم المستخدم أولاً', 'red');

      document.getElementById('login-step').style.display = 'none';
      document.getElementById('scan-step').style.display = 'block';
      setStatus('جاري تشغيل الكاميرا المباشرة...', 'orange');

      // تشغيل الكاميرا الحية
      try {
        const video = document.getElementById('webcam');
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = videoStream;
        setStatus('الكاميرا جاهزة للالتقاط', 'green');
      } catch (err) {
        setStatus('تعذر الوصول للكاميرا، يرجى إعطاء الصلاحية', 'red');
      }
    }

    // التقاط إطار مباشر من الفيديو وتحليله
    async function captureAndVerify() {
      const video = document.getElementById('webcam');
      if (!videoStream || !video.srcObject) {
        return setStatus('الكاميرا غير متصلة', 'red');
      }

      setStatus('جاري التحليل البيومتري للصورة الحية...', 'orange');

      if (!model) await loadModel();

      // تحليل بث الكاميرا الفعلي مباشرة عبر النموذج
      const predictions = await model.predict(video);
      let bestMatch = predictions.reduce((max, p) => p.probability > max.probability ? p : max, predictions[0]);
      let confidence = (bestMatch.probability * 100).toFixed(1);

      const label = bestMatch.className.toUpperCase();
      
      if ((label === "COFFEE" || label === "MOUSE") && bestMatch.probability > 0.65) {
        setStatus(`تم التحقق بنجاح! العنصر: ${label} (${confidence}%)`, 'green');
        
        // إيقاف الكاميرا بعد النجاح
        videoStream.getTracks().forEach(track => track.stop());
      } else {
        setStatus('عنصر غير مطابق! يرجى إظهار Coffee أو Mouse بوضوح أمام الكاميرا', 'red');
      }
    }

    function setStatus(msg, color = 'black') {
      const el = document.getElementById('status-msg');
      el.innerText = msg;
      el.style.color = color === 'green' ? '#2E7D32' : color === 'red' ? '#C62828' : '#D97706';
    }
  </script>
</body>
</html>
