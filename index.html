<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الذاكرة الرقمية للأجيال - التحقق الحَي</title>
  <style>
    :root {
      --primary-color: #8C2B2B;
      --accent-color: #C5A059;
      --bg-color: #FAF6F0;
      --card-bg: #FFFFFF;
      --text-color: #333333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      direction: rtl;
    }

    .vault-card {
      background: var(--card-bg);
      border: 1px solid #E5DDCB;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(140, 43, 43, 0.08);
      text-align: center;
    }

    .logo-title {
      font-size: 22px;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 13px;
      color: #777;
      margin-bottom: 20px;
    }

    /* تبويبات تسجيل الدخول / إنشاء حساب */
    .tab-group {
      display: flex;
      border-bottom: 1px solid #E5DDCB;
      margin-bottom: 15px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      color: #888;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .tab-btn.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }

    .input-field {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      border: 1px solid #D1C7BD;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .btn-main {
      display: block;
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      background-color: var(--primary-color);
      color: #FFF;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      text-align: center;
    }

    .btn-main:hover {
      background-color: #6E2020;
    }

    .btn-main:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* زر ثانوي (إطار فقط) */
    .btn-secondary {
      background-color: #FFF;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: #F7EFEF;
    }

    .hint {
      font-size: 14px;
      color: #555;
      margin-bottom: 10px;
    }

    /* حاوية الفيديو والكاميرا المباشرة */
    .webcam-container {
      position: relative;
      width: 100%;
      height: 260px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin: 15px 0;
      border: 2px solid var(--accent-color);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scan-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      border: 2px dashed rgba(255, 255, 255, 0.7);
      border-radius: 10px;
      pointer-events: none;
    }

    /* الصورة الملتقطة بعد نجاح التحقق */
    .snapshot {
      display: block;
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid var(--accent-color);
      margin: 15px 0;
      background: #000;
    }

    #status-msg {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
      min-height: 20px;
    }
  </style>

  <!-- TensorFlow & Teachable Machine CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
</head>
<body>

  <div class="vault-card">
    <div class="logo-title">الذاكرة الرقمية للأجيال</div>
    <div class="subtitle">Family Vault - نظام التحقق الحي</div>

    <!-- 1. خطوة تسجيل الدخول / إنشاء حساب -->
    <div id="auth-step">
      <div class="tab-group">
        <button class="tab-btn active" id="tab-login" onclick="switchAuthMode('login')">تسجيل الدخول</button>
        <button class="tab-btn" id="tab-register" onclick="switchAuthMode('register')">إنشاء حساب</button>
      </div>

      <!-- نموذج تسجيل الدخول -->
      <div id="login-form">
        <input type="text" id="username" class="input-field" placeholder="اسم المستخدم" autocomplete="username">
        <input type="password" id="password" class="input-field" placeholder="كلمة المرور" autocomplete="current-password">
        <button class="btn-main" id="login-btn" onclick="login()">دخول</button>
      </div>

      <!-- نموذج إنشاء حساب جديد -->
      <div id="register-form" style="display: none;">
        <input type="text" id="reg-username" class="input-field" placeholder="اسم المستخدم الجديد" autocomplete="username">
        <input type="password" id="reg-password" class="input-field" placeholder="كلمة المرور (4 أحرف على الأقل)" autocomplete="new-password">
        <input type="password" id="reg-confirm" class="input-field" placeholder="تأكيد كلمة المرور" autocomplete="new-password">
        <button class="btn-main" id="register-btn" onclick="register()">إنشاء الحساب</button>
      </div>
    </div>

    <!-- 2. خطوة التحقق الحي بالكاميرا (Coffee / Mouse) -->
    <div id="scan-step" style="display: none;">
      <p class="hint">وجّه الكاميرا نحو <b>Coffee</b> أو <b>Mouse</b> ثم اضغط زر التحقق:</p>

      <div class="webcam-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="scan-overlay"></div>
      </div>

      <button class="btn-main" id="capture-btn" onclick="captureAndVerify()" disabled>التقاط والتحقق 📷</button>

      <!-- بديل يظهر فقط إذا تعذر تشغيل الكاميرا المباشرة (مثل بعض تطبيقات الهاتف) -->
      <div id="fallback-box" style="display: none;">
        <label class="btn-main btn-secondary" for="photo-input">التقاط صورة بكاميرا الجهاز 📸</label>
        <input type="file" id="photo-input" accept="image/*" capture="environment" style="display: none;" onchange="onFallbackPhoto(this)">
        <button class="btn-main btn-secondary" onclick="startCamera()">إعادة محاولة تشغيل الكاميرا المباشرة</button>
      </div>
    </div>

    <!-- 3. نجاح التحقق -->
    <div id="done-step" style="display: none;">
      <canvas id="snapshot" class="snapshot"></canvas>
      <button class="btn-main btn-secondary" onclick="logout()">تسجيل الخروج</button>
    </div>

    <div id="status-msg"></div>
  </div>

  <script>
    // ============================================================
    //  الإعدادات: عدّل من هنا فقط
    // ============================================================
    // حسابات ثابتة جاهزة بالصيغة  "اسم المستخدم": "كلمة المرور"
    // (الحسابات الجديدة من تبويب "إنشاء حساب" تُحفظ في متصفح الجهاز نفسه)
    const USERS = {
      "admin": "1234"
      // "user2": "5678"
    };

    // الفئات المقبولة من نموذج Teachable Machine (كما هي في metadata.json)
    const ALLOWED_LABELS = ["COFFEE", "MOUSE"];

    // أقل نسبة ثقة مقبولة (0.65 = 65%)
    const MIN_CONFIDENCE = 0.65;

    // مكان ملفات النموذج model.json و metadata.json و weights.bin
    const MODEL_URL = "./";

    // مفتاح حفظ الحسابات الجديدة في متصفح الجهاز
    const ACCOUNTS_KEY = "fv_accounts";
    // ============================================================

    let model = null;
    let modelPromise = null;
    let videoStream = null;
    let currentUser = "";

    // ---------- تحميل نموذج Coffee / Mouse ----------
    function loadModel() {
      if (model) return Promise.resolve(model);
      if (!modelPromise) {
        modelPromise = (async () => {
          if (typeof tmImage === 'undefined') {
            throw new Error('مكتبة التعرف لم تُحمَّل');
          }
          model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
          return model;
        })().catch(err => {
          modelPromise = null; // نسمح بإعادة المحاولة لاحقاً
          throw err;
        });
      }
      return modelPromise;
    }

    // نبدأ تحميل النموذج مبكراً أثناء كتابة بيانات الدخول
    loadModel().catch(err => console.warn('تعذر تحميل النموذج مبكراً:', err));

    // ---------- الحسابات المحفوظة في الجهاز ----------
    function loadAccounts() {
      try {
        return JSON.parse(localStorage.getItem(ACCOUNTS_KEY)) || {};
      } catch (e) {
        return {};
      }
    }

    function saveAccounts(accounts) {
      try {
        localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
        return true;
      } catch (e) {
        return false;
      }
    }

    // البحث عن اسم مستخدم بدون تفريق بين الأحرف الكبيرة والصغيرة
    function findUserKey(obj, name) {
      const lower = name.toLowerCase();
      return Object.keys(obj).find(k => k.toLowerCase() === lower) || null;
    }

    // تشفير كلمة المرور قبل حفظها (SHA-256) حتى لا تُحفظ كنص واضح
    async function hashPassword(password) {
      if (window.crypto && crypto.subtle && window.TextEncoder) {
        const data = new TextEncoder().encode(password);
        const digest = await crypto.subtle.digest('SHA-256', data);
        return 'sha256:' + Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      return 'plain:' + password;
    }

    async function passwordMatches(stored, password) {
      if (!stored) return false;
      if (stored.startsWith('plain:')) return stored === 'plain:' + password;
      return stored === await hashPassword(password);
    }

    // ---------- 1) التبديل بين تسجيل الدخول وإنشاء حساب ----------
    function switchAuthMode(mode) {
      const isLogin = mode === 'login';
      document.getElementById('login-form').style.display = isLogin ? 'block' : 'none';
      document.getElementById('register-form').style.display = isLogin ? 'none' : 'block';
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-register').classList.toggle('active', !isLogin);
      setStatus('');
    }

    // إنشاء حساب جديد (يُحفظ في متصفح هذا الجهاز)
    async function register() {
      const user = document.getElementById('reg-username').value.trim();
      const pass = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;

      if (user.length < 3) return setStatus('اسم المستخدم يجب أن يكون 3 أحرف على الأقل', 'red');
      if (pass.length < 4) return setStatus('كلمة المرور يجب أن تكون 4 أحرف على الأقل', 'red');
      if (pass !== confirm) return setStatus('كلمتا المرور غير متطابقتين', 'red');

      const accounts = loadAccounts();
      if (findUserKey(USERS, user) || findUserKey(accounts, user)) {
        return setStatus('اسم المستخدم مستخدم مسبقاً، اختر اسماً آخر', 'red');
      }

      const btn = document.getElementById('register-btn');
      btn.disabled = true;
      try {
        accounts[user] = { hash: await hashPassword(pass), createdAt: new Date().toISOString() };
        if (!saveAccounts(accounts)) {
          return setStatus('المتصفح لا يسمح بحفظ الحسابات على هذا الجهاز', 'red');
        }
      } finally {
        btn.disabled = false;
      }

      // تفريغ حقول التسجيل والانتقال لتسجيل الدخول بالاسم الجديد
      document.getElementById('reg-username').value = '';
      document.getElementById('reg-password').value = '';
      document.getElementById('reg-confirm').value = '';
      switchAuthMode('login');
      document.getElementById('username').value = user;
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
      setStatus('تم إنشاء الحساب بنجاح ✅ أدخل كلمة المرور لتسجيل الدخول', 'green');
    }

    // تسجيل الدخول (الحسابات الثابتة + الحسابات المحفوظة في الجهاز)
    async function login() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;

      if (!user || !pass) {
        return setStatus('يرجى إدخال اسم المستخدم وكلمة المرور', 'red');
      }

      let ok = false;
      let displayName = user;

      const builtinKey = findUserKey(USERS, user);
      if (builtinKey && USERS[builtinKey] === pass) {
        ok = true;
        displayName = builtinKey;
      } else {
        const accounts = loadAccounts();
        const key = findUserKey(accounts, user);
        if (key) {
          ok = await passwordMatches(accounts[key].hash, pass);
          displayName = key;
        }
      }

      if (!ok) {
        return setStatus('اسم المستخدم أو كلمة المرور غير صحيحة', 'red');
      }

      currentUser = displayName;
      document.getElementById('auth-step').style.display = 'none';
      document.getElementById('scan-step').style.display = 'block';
      startCamera();
    }

    // الضغط على Enter داخل الحقول ينفّذ الزر المناسب
    ['username', 'password'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
      });
    });
    ['reg-username', 'reg-password', 'reg-confirm'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') register();
      });
    });

    // ---------- 2) الكاميرا المباشرة ----------
    async function startCamera() {
      const video = document.getElementById('webcam');
      const captureBtn = document.getElementById('capture-btn');
      const fallbackBox = document.getElementById('fallback-box');

      captureBtn.disabled = true;
      fallbackBox.style.display = 'none';
      setStatus('جاري تشغيل الكاميرا المباشرة...', 'orange');

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return showFallback(window.isSecureContext
          ? 'هذا المتصفح لا يدعم الكاميرا المباشرة'
          : 'الكاميرا المباشرة تعمل فقط عبر رابط https');
      }

      // نجرب الكاميرا الخلفية أولاً (لتصوير الأغراض)، ثم أي كاميرا متاحة
      const attempts = [
        { video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false },
        { video: true, audio: false }
      ];

      let lastError = null;
      for (const constraints of attempts) {
        try {
          stopCamera();
          videoStream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = videoStream;
          await video.play().catch(() => {});
          captureBtn.disabled = false;
          return setStatus('الكاميرا جاهزة، وجّهها نحو Coffee أو Mouse ثم اضغط التقاط والتحقق', 'green');
        } catch (err) {
          lastError = err;
        }
      }

      showFallback(describeCameraError(lastError));
    }

    function describeCameraError(err) {
      const name = err && err.name ? err.name : '';
      switch (name) {
        case 'NotAllowedError':
        case 'PermissionDeniedError':
          return 'تم رفض صلاحية الكاميرا، اسمح للكاميرا من إعدادات المتصفح أو التطبيق';
        case 'NotFoundError':
        case 'DevicesNotFoundError':
          return 'لم يتم العثور على كاميرا في هذا الجهاز';
        case 'NotReadableError':
        case 'TrackStartError':
          return 'الكاميرا مستخدمة حالياً من تطبيق آخر، أغلقه وأعد المحاولة';
        case 'SecurityError':
          return 'الكاميرا المباشرة تعمل فقط عبر رابط https';
        default:
          return 'تعذر تشغيل الكاميرا المباشرة' + (name ? ' (' + name + ')' : '');
      }
    }

    // عند تعذر الكاميرا المباشرة نعرض زر التقاط صورة بكاميرا الجهاز حتى لا يتوقف الدخول
    function showFallback(message) {
      document.getElementById('fallback-box').style.display = 'block';
      setStatus(message + '. يمكنك استخدام زر التقاط صورة بكاميرا الجهاز', 'red');
    }

    // رسم الصورة (من الفيديو أو من ملف) داخل لوحة الالتقاط بحجم مناسب
    function drawToSnapshot(source, width, height) {
      const canvas = document.getElementById('snapshot');
      const scale = Math.min(1, 640 / width);
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
      return canvas;
    }

    // التقاط إطار مباشر من الفيديو ثم تحليله بالنموذج
    async function captureAndVerify() {
      const video = document.getElementById('webcam');
      if (!videoStream || !video.videoWidth) {
        return setStatus('الكاميرا لم تبدأ بعد، انتظر لحظة ثم أعد المحاولة', 'red');
      }
      const canvas = drawToSnapshot(video, video.videoWidth, video.videoHeight);
      await verifyImage(canvas);
    }

    // صورة من كاميرا الجهاز (البديل) ثم تحليلها بنفس النموذج
    function onFallbackPhoto(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = async () => {
        const canvas = drawToSnapshot(img, img.width, img.height);
        URL.revokeObjectURL(url);
        input.value = '';
        await verifyImage(canvas);
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        input.value = '';
        setStatus('تعذر قراءة الصورة، حاول مرة أخرى', 'red');
      };
      img.src = url;
    }

    // ---------- 3) التحقق عبر نموذج Coffee / Mouse ----------
    async function verifyImage(source) {
      const captureBtn = document.getElementById('capture-btn');
      captureBtn.disabled = true;
      try {
        if (!model) setStatus('جاري تحميل نموذج التعرف...', 'orange');
        const m = await loadModel();

        setStatus('جاري تحليل الصورة...', 'orange');
        const predictions = await m.predict(source);
        const best = predictions.reduce((a, b) => (b.probability > a.probability ? b : a), predictions[0]);
        const label = best.className.trim().toUpperCase();
        const confidence = (best.probability * 100).toFixed(1);

        if (ALLOWED_LABELS.includes(label) && best.probability >= MIN_CONFIDENCE) {
          finishVerification(label, confidence);
        } else {
          setStatus('لم يتم التعرف على Coffee أو Mouse بوضوح (أعلى تطابق: ' + label + ' ' + confidence + '%)، قرّب الغرض وأعد المحاولة', 'red');
        }
      } catch (err) {
        console.error(err);
        setStatus('تعذر تحميل نموذج التعرف، تأكد من الاتصال بالإنترنت ثم أعد المحاولة', 'red');
      } finally {
        if (videoStream) captureBtn.disabled = false;
      }
    }

    function finishVerification(label, confidence) {
      stopCamera();
      document.getElementById('scan-step').style.display = 'none';
      document.getElementById('done-step').style.display = 'block';
      setStatus('تم التحقق بنجاح ✅ العنصر: ' + label + ' (' + confidence + '%) - مرحباً ' + currentUser, 'green');
    }

    function logout() {
      stopCamera();
      location.reload();
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
      const video = document.getElementById('webcam');
      if (video) video.srcObject = null;
    }

    // إيقاف الكاميرا عند مغادرة الصفحة
    window.addEventListener('pagehide', stopCamera);

    function setStatus(msg, color = 'black') {
      const el = document.getElementById('status-msg');
      el.innerText = msg;
      el.style.color = color === 'green' ? '#2E7D32' : color === 'red' ? '#C62828' : '#D97706';
    }
  </script>
</body>
</html>
