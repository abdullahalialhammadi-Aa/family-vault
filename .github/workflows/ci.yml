name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: فحوص ثابتة و TOTP
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: فحص بنية الصفحات
        run: node tests/structure.test.mjs

      # تقرير فقط ولا يُسقط البناء: شبكة الخادم قد تحجب الشبكة الخارجية
      # بينما تعمل عند المستخدمين عادةً
      - name: التحقّق من وصول المكتبات الخارجية
        continue-on-error: true
        run: |
          for u in \
            "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js" \
            "https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" \
            "https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js" \
            "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights/face_recognition_model-shard1"; do
            printf '%s  ' "$(curl -s -o /dev/null -w 'HTTP %{http_code} في %{time_total}ث %{size_download}بايت' --max-time 30 "$u")"
            echo "$u"
          done

      - name: اختبار TOTP مقابل معيار RFC 6238
        run: node tests/totp.test.mjs

  browser:
    name: اختبار البوابة في متصفّح
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: التأكّد من توفّر Chrome
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium-browser >/dev/null 2>&1; then
            chromium-browser --version
          else
            sudo apt-get update
            sudo apt-get install -y chromium-browser
          fi

      - name: تشغيل اختبار بوابة التحقّق الثلاثية
        run: node tests/flow.test.mjs

      - name: رفع لقطات الشاشة عند الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
